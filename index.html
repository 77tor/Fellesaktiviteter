<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoleplan - Live</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 3px solid #3498db; padding-bottom: 15px; margin-bottom: 5px; }
        .skolear-sub { text-align: center; color: #7f8c8d; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
        .info-box { background: #e8f4fd; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 0.85em; border-left: 5px solid #3498db; text-align: center; }
        .controls { margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #dee2e6; border-radius: 8px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #7f8c8d; text-transform: uppercase; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #ced4da; font-size: 14px; width: 100%; box-sizing: border-box; }
        .status-msg { text-align: center; padding: 40px; font-style: italic; color: #3498db; }
        .no-results { text-align: center; padding: 30px; font-weight: bold; color: #e74c3c; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { background-color: #34495e; color: white; text-transform: uppercase; font-size: 11px; }
        
        /* Månedsfarger */
        .month-color-0 { background-color: #ffffff !important; }
        .month-color-1 { background-color: #f0f7ff !important; }
        .month-color-2 { background-color: #f5f0ff !important; }
        .month-color-3 { background-color: #f0fff4 !important; }
        .month-color-4 { background-color: #fffaf0 !important; }
        .month-color-5 { background-color: #fff0f0 !important; }
        tr:hover { background-color: #e2e8f0 !important; }

        .btn-reset { grid-column: 1 / -1; padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-reset:hover { background: #7f8c8d; }
        .footer-info { text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="hovedTittel">Fellesaktiviteter</h1>
    <div id="skolearVisning" class="skolear-sub">Laster skoleår...</div>
    
    <div class="info-box">Heståsen (1.-3.trinn) | Brattbakken (4.-7.trinn)</div>

    <div class="controls">
        <div class="filter-group">
            <label>Søk</label>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Søk i planen...">
        </div>
        <div class="filter-group">
            <label>Deltakelse</label>
            <select id="deltakerFilter" onchange="filterTable()">
                <option value="">Vis alle</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Ansvar</label>
            <select id="ansvarFilter" onchange="filterTable()">
                <option value="">Vis alle</option>
            </select>
        </div>
        <button class="btn-reset" onclick="resetFilters()">Nullstill filtre</button>
    </div>

    <div id="loader" class="status-msg">Henter oppdatert plan fra Google...</div>
    <div id="noResults" class="no-results">Ingen aktiviteter matcher valgte filtre.</div>
    
    <table id="aktivitetsTabell">
        <thead>
            <tr>
                <th>Mnd</th><th>Aktivitet</th><th>Dato</th><th>Deltakere</th><th>Ansvar</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="footer-info" id="lastUpdated">Laster dato...</div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSBt4leeUPe4YsOM7rjGDaT7Eq322BVnExQvVIxhMeFqcATE7kqoYWay7k7lRH1cULOen7rEF6d6pSY/pub?output=csv';

function oppdaterSkolear() {
    const na = new Date();
    const aar = na.getFullYear();
    const skolear = na.getMonth() >= 6 ? `${aar}/${aar + 1}` : `${aar - 1}/${aar}`;
    document.getElementById('skolearVisning').textContent = `Skoleåret ${skolear}`;
}

// Oppdatert for å takle BÅDE norsk semikolon (;) og vanlig komma (,)
function parseCSVLine(text) {
    let separator = text.includes(';') ? ';' : ',';
    const fields = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c === '"') {
            inQuotes = !inQuotes;
        } else if (c === separator && !inQuotes) {
            fields.push(field.trim());
            field = '';
        } else {
            field += c;
        }
    }
    fields.push(field.trim());
    return fields.map(f => f.replace(/^"|"$/g, '').trim());
}

async function fetchData() {
    oppdaterSkolear();
    const loader = document.getElementById('loader');
    const updateDisplay = document.getElementById('lastUpdated');
    const cachedData = localStorage.getItem('skoleplanCache');
    const cachedTime = localStorage.getItem('skoleplanTime');

    if (cachedData) {
        renderTable(cachedData);
        updateDisplay.innerHTML = "Viser lagret plan fra: " + (cachedTime || "ukjent");
    }

    try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL + "&t=" + new Date().getTime()));
        if (!response.ok) throw new Error("Nettverksfeil");
        const data = await response.text();
        
        if (data.length > 50) {
            const nå = new Date();
            const datoStreng = nå.toLocaleDateString('no-NO') + " kl. " + nå.toLocaleTimeString('no-NO', {hour: '2-digit', minute:'2-digit'});
            localStorage.setItem('skoleplanCache', data);
            localStorage.setItem('skoleplanTime', datoStreng);
            renderTable(data);
            updateDisplay.innerHTML = "Planen ble oppdatert: " + datoStreng;
            loader.style.display = 'none';
        }
    } catch (err) {
        console.error("Henting feilet:", err);
        if (cachedData) {
            updateDisplay.innerHTML = "Kunne ikke hente nye data fra Google. Viser lagret versjon fra " + cachedTime;
        }
    }
}

function renderTable(csvText) {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = ""; 
    const lines = csvText.split(/\r?\n/);
    let lastMonthName = ""; 
    let colorIndex = 0;

    const unikeDeltakere = new Set();
    const unikeAnsvar = new Set();

    lines.forEach((line, index) => {
        if (index === 0 || !line.trim()) return;
        
        const parts = parseCSVLine(line);
        if (parts.length < 3) return;

        const mnd = parts[0] || "";
        const aktivitet = parts[1] || "";
        const dato = parts[2] || "";
        const deltakere = parts[3] || "";
        const ansvar = parts[4] || "";

        if(deltakere) deltakere.split(',').forEach(d => unikeDeltakere.add(d.trim()));
        if(ansvar) ansvar.split(',').forEach(a => unikeAnsvar.add(a.trim()));

        if (mnd !== "" && mnd.toLowerCase() !== lastMonthName.toLowerCase()) {
            colorIndex = (colorIndex + 1) % 6;
            lastMonthName = mnd;
        }

        const tr = document.createElement('tr');
        tr.className = `month-color-${colorIndex}`;
        
        tr.setAttribute('data-deltakere', deltakere.toUpperCase());
        tr.setAttribute('data-ansvar', ansvar.toUpperCase());
        
        tr.innerHTML = `<td><strong>${mnd}</strong></td><td>${aktivitet}</td><td>${dato}</td><td>${deltakere}</td><td>${ansvar}</td>`;
        tableBody.appendChild(tr);
    });

    byggFilterMeny("deltakerFilter", unikeDeltakere);
    byggFilterMeny("ansvarFilter", unikeAnsvar);

    document.getElementById('aktivitetsTabell').style.display = 'table';
    document.getElementById('loader').style.display = 'none';
}

function byggFilterMeny(id, set) {
    const select = document.getElementById(id);
    const arkivertValg = select.value; 
    
    select.innerHTML = '<option value="">Vis alle</option>';
    
    Array.from(set).sort().forEach(verdi => {
        if(!verdi || verdi.toUpperCase() === "ALLE TRINN" || verdi.toUpperCase() === "ALLE") return; 
        const opt = document.createElement('option');
        opt.value = verdi.toUpperCase();
        opt.textContent = verdi;
        select.appendChild(opt);
    });
    
    select.value = arkivertValg;
}

function filterTable() {
    const search = document.getElementById("searchInput").value.toUpperCase();
    const dVal = document.getElementById("deltakerFilter").value; 
    const aVal = document.getElementById("ansvarFilter").value;
    const rows = document.querySelectorAll("#tableBody tr");
    let synligeRader = 0;

    rows.forEach(row => {
        const dText = row.getAttribute('data-deltakere') || "";
        const aText = row.getAttribute('data-ansvar') || "";
        const fullText = row.textContent.toUpperCase();

        let mD = (dVal === "");
        if (!mD) {
            const direkteTreff = dText.includes(dVal) || dText.includes("ALLE");
            const hSone = dText.includes("HESTÅSEN") && (dVal.includes("1") || dVal.includes("2") || dVal.includes("3"));
            const bSone = dText.includes("BRATTBAKKEN") && (dVal.includes("4") || dVal.includes("5") || dVal.includes("6") || dVal.includes("7"));
            
            mD = direkteTreff || hSone || bSone;
        }

        let mA = (aVal === "");
        if (!mA) {
            mA = aText.includes(aVal) || aText.includes("ALLE");
        }

        const mSearch = fullText.includes(search);

        if (mD && mA && mSearch) {
            row.style.display = "";
            synligeRader++;
        } else {
            row.style.display = "none";
        }
    });

    document.getElementById("noResults").style.display = synligeRader === 0 ? "block" : "none";
    document.getElementById("aktivitetsTabell").style.display = synligeRader === 0 ? "none" : "table";
}

function resetFilters() {
    document.getElementById("searchInput").value = "";
    document.getElementById("deltakerFilter").value = "";
    document.getElementById("ansvarFilter").value = "";
    filterTable();
}

window.onload = fetchData;
</script>
</body>
</html>
