<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fellesaktiviteter</title>

<style>
body { font-family: Arial; background:#f8f9fa; margin:20px;}
.container { max-width:1100px; margin:auto; background:white; padding:20px; border-radius:10px;}
h1 { text-align:center; }

.controls {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:20px;
    align-items: end;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-size: 11px;
    font-weight: bold;
    color: #7f8c8d;
    text-transform: uppercase;
}

input, select, button { padding:8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; width: 100%; box-sizing: border-box; }
button { background: #95a5a6; color: white; cursor: pointer; border: none; font-weight: bold; padding: 10px; }
button:hover { background: #7f8c8d; }

table { width:100%; border-collapse: collapse; display:none; }
th, td { padding:10px; border-bottom:1px solid #ddd; }
th { background:#2c3e50; color:white; }

.status-msg { text-align:center; padding:20px; }
.no-results { text-align:center; color:red; display:none; }

.month-color-0 { background:#fff; }
.month-color-1 { background:#f0f7ff; }
.month-color-2 { background:#f5f0ff; }
.month-color-3 { background:#f0fff4; }
.month-color-4 { background:#fffaf0; }
.month-color-5 { background:#fff0f0; }
</style>
</head>

<body>

<div class="container">

<h1>Fellesaktiviteter</h1>
<div id="skolearVisning" style="text-align:center; color:#7f8c8d; font-weight:bold; margin-bottom:15px;"></div>

<div class="controls">
<div class="filter-group">
    <label for="searchInput">Søk</label>
    <input id="searchInput" onkeyup="filterTable()" placeholder="Søk i planen...">
</div>

<div class="filter-group">
    <label for="deltakerFilter">Deltakelse</label>
    <select id="deltakerFilter" onchange="filterTable()">
        <option value="">Alle deltakere</option>
    </select>
</div>

<div class="filter-group">
    <label for="ansvarFilter">Ansvar</label>
    <select id="ansvarFilter" onchange="filterTable()">
        <option value="">Alle ansvar</option>
    </select>
</div>

<div class="filter-group">
    <button onclick="resetFilters()">Nullstill</button>
</div>
</div>

<div id="loader" class="status-msg">Laster data...</div>
<div id="noResults" class="no-results">Ingen treff</div>

<table id="aktivitetsTabell">
<thead>
<tr>
<th>Mnd</th><th>Aktivitet</th><th>Dato</th><th>Deltakere</th><th>Ansvar</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBt4leeUPe4YsOM7rjGDaT7Eq322BVnExQvVIxhMeFqcATE7kqoYWay7k7lRH1cULOen7rEF6d6pSY/pub?output=csv";

// Faste valg for Deltakelse-menyen (Uten "Alle trinn")
const FASTE_DELTAKER = [
    "1. trinn",
    "2. trinn",
    "3. trinn",
    "4. trinn",
    "5. trinn",
    "6. trinn",
    "7. trinn"
];

// Faste valg for Ansvar-menyen
const FASTE_ANSVAR = [
    "1. trinn",
    "2. trinn",
    "3. trinn",
    "4. trinn",
    "5. trinn",
    "6. trinn",
    "7. trinn",
    "Elevrådet",
    "FAU",
    "Kirka",
    "Alle trinn"
];

function oppdaterSkolear(){
    const d=new Date();
    const y=d.getFullYear();
    const skolear=d.getMonth()>=6?`${y}/${y+1}`:`${y-1}/${y}`;
    document.getElementById("skolearVisning").textContent="Skoleår: "+skolear;
}

function parseCSVLine(line, sep){
    let res=[], cur="", inQuotes=false;

    for(let i=0;i<line.length;i++){
        let c=line[i];

        if(c==='"'){
            inQuotes=!inQuotes;
        }
        else if(c===sep && !inQuotes){
            res.push(cur.trim());
            cur="";
        }
        else{
            cur+=c;
        }
    }
    res.push(cur.trim());

    return res.map(x=>x.replace(/^"|"$/g,""));
}

async function fetchData(){
    oppdaterSkolear();

    try{
        const res = await fetch(CSV_URL + "&t=" + Date.now());
        if(!res.ok) throw new Error("Fetch-feil");

        // ✅ Riktig encoding-fix
        const buffer = await res.arrayBuffer();
        const decoder = new TextDecoder("utf-8");
        let text = decoder.decode(buffer);

        // ✅ Fiks rare tegn
        text = text.replace(/\u00A0/g," ");
        text = text.replace(/â€“/g,"-");

        // ✅ cache
        localStorage.setItem("csvCache", text);

        renderTable(text);
        document.getElementById("loader").style.display="none";

    }catch(e){
        console.error(e);

        let cache = localStorage.getItem("csvCache");

        if(cache){
            renderTable(cache);
            document.getElementById("loader").textContent="Viser lagret data";
        }else{
            document.getElementById("loader").textContent="Kunne ikke laste data";
        }
    }
}

function renderTable(csv){

    const lines = csv.split(/\r?\n/);

    // ✅ riktig separator
    const sep = lines[0].includes(";") ? ";" : ",";

    const body = document.getElementById("tableBody");
    body.innerHTML="";

    let monthPrev="";
    let colorIndex=0;
    let seen=new Set(); // ✅ unngå duplikater

    lines.forEach((line,i)=>{
        if(i===0 || !line.trim()) return;
        if(seen.has(line)) return;
        seen.add(line);

        let p = parseCSVLine(line,sep);
        if(p.length<3) return;

        let [mnd, aktivitet, dato, deltakere="", ansvar=""] = p;

        if(mnd && mnd.toLowerCase()!==monthPrev.toLowerCase()){
            colorIndex=(colorIndex+1)%6;
            monthPrev=mnd;
        }

        let tr=document.createElement("tr");
        tr.className="month-color-"+colorIndex;

        tr.setAttribute("data-deltakere",deltakere.toUpperCase());
        tr.setAttribute("data-ansvar",ansvar.toUpperCase());

        tr.innerHTML=`
        <td>${mnd}</td>
        <td>${aktivitet}</td>
        <td>${dato}</td>
        <td>${deltakere}</td>
        <td>${ansvar}</td>`;

        body.appendChild(tr);
    });

    byggFasteFilter("deltakerFilter", FASTE_DELTAKER, "Alle deltakere");
    byggFasteFilter("ansvarFilter", FASTE_ANSVAR, "Alle ansvar");

    document.getElementById("aktivitetsTabell").style.display="table";
}

function byggFasteFilter(id, liste, standardTekst){
    const sel=document.getElementById(id);
    let current=sel.value;

    sel.innerHTML=`<option value="">${standardTekst}</option>`;

    liste.forEach(v=>{
        let o=document.createElement("option");
        o.value=v.toUpperCase();
        o.textContent=v;
        sel.appendChild(o);
    });

    sel.value=current;
}

function filterTable(){
    let search = document.getElementById("searchInput").value.toUpperCase();
    let dVal = document.getElementById("deltakerFilter").value;
    let aVal = document.getElementById("ansvarFilter").value;

    let rows = document.querySelectorAll("#tableBody tr");
    let visible = 0;

    rows.forEach(r => {
        let d = r.getAttribute("data-deltakere") || "";
        let a = r.getAttribute("data-ansvar") || "";
        let t = r.textContent.toUpperCase();

        // --- Deltaker-logikk for samlebegrep ---
        let matchDeltaker = (dVal === "");

        if (!matchDeltaker) {
            let direkteMatch = d.includes(dVal);
            let gjelderAlle = d.includes("ALLE");
            
            // Sjekk om valgt filter gjelder Heståsen (1., 2., 3. trinn)
            let erHestasenKandidat = dVal.includes("1") || dVal.includes("2") || dVal.includes("3");
            let erHestasenSone = erHestasenKandidat && d.includes("HESTÅSEN");

            // Sjekk om valgt filter gjelder Brattbakken (4., 5., 6., 7. trinn)
            let erBrattbakkenKandidat = dVal.includes("4") || dVal.includes("5") || dVal.includes("6") || dVal.includes("7");
            let erBrattbakkenSone = erBrattbakkenKandidat && d.includes("BRATTBAKKEN");

            matchDeltaker = direkteMatch || gjelderAlle || erHestasenSone || erBrattbakkenSone;
        }

        // --- Ansvar-logikk for faste valg ---
        let matchAnsvar = (aVal === "");
        if (!matchAnsvar) {
            let direkteMatch = a.includes(aVal);
            let gjelderAlle = a.includes("ALLE");

            matchAnsvar = direkteMatch || gjelderAlle;
        }

        // --- Søkefelt ---
        let matchSok = t.includes(search);

        let ok = matchDeltaker && matchAnsvar && matchSok;

        r.style.display = ok ? "" : "none";
        if (ok) visible++;
    });

    document.getElementById("noResults").style.display = visible === 0 ? "block" : "none";
}

function resetFilters(){
    document.getElementById("searchInput").value="";
    document.getElementById("deltakerFilter").value="";
    document.getElementById("ansvarFilter").value="";
    filterTable();
}

window.onload=fetchData;

// ✅ oppdater hvert 5. minutt
setInterval(fetchData, 300000);

</script>

</body>
</html>
